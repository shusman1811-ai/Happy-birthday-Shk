<title>Happy Birthday Zivah! 🎉</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Arial',sans-serif;overflow:hidden;background:#000}
.page{width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;position:absolute;transition:1s}
.hidden{transform:translateX(100vw)}
button{padding:15px 35px;font-size:20px;border:none;border-radius:50px;background:#ff2d92;color:white;cursor:pointer;box-shadow:0 5px 20px rgba(255,45,146,.5);animation:glow 1.5s infinite}
@keyframes glow{50%{box-shadow:0 5px 40px rgba(255,45,146,1)}}

/* PAGE 1 - BIRTHDAY WISH */
#page1{background:linear-gradient(135deg,#ff9a9e,#fad0c4)}
#page1 h1{font-size:60px;color:#d1006b;animation:pop 1s infinite}
#page1 h2{font-size:40px;color:#333;margin:10px}
.confetti{position:absolute;width:10px;height:10px;animation:fall 3s linear infinite}
@keyframes fall{to{transform:translateY(100vh) rotate(360deg)}}
@keyframes pop{50%{transform:scale(1.1)}}

/* PAGE 2 - CAKE CUTTING */
#page2{background:#1a1a2e}
.cake{font-size:150px;animation:bounce 2s infinite;cursor:pointer}
@keyframes bounce{50%{transform:translateY(-20px)}}
.flame{font-size:30px;position:absolute;animation:flicker .5s infinite}
@keyframes flicker{50%{opacity:.5}}
.cut-line{width:5px;height:200px;background:white;position:absolute;opacity:0}

/* PAGE 3 - FINAL WISH */
#page3{background:linear-gradient(135deg,#667eea,#764ba2);color:white;text-align:center;padding:30px}
#page3 h1{font-size:45px;margin-bottom:20px}
.type{font-size:22px;line-height:1.8;border-right:3px solid white;white-space:pre-wrap;overflow:hidden;width:0;animation:typing 5s steps(40) 1s forwards}
@keyframes typing{to{width:100%}}
</style>
</head>

</div>
