<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Zivah 🎉</title>
<style>
  body { margin:0; font-family:Arial; overflow:hidden; }
  .page { width:100%; height:100vh; display:none; justify-content:center; align-items:center; flex-direction:column; text-align:center; }
  .active { display:flex; }
  button { padding:14px 30px; font-size:18px; border:none; border-radius:30px; background:#ff2d92; color:#fff; cursor:pointer; margin-top:20px; }
  
  #page1 { background:linear-gradient(pink, lightcoral); }
  #page1 h1 { font-size:50px; color:#d1006b; }
  
  #page2 { background:#111; color:#fff; }
  .cake { font-size:120px; cursor:pointer; }
  
  #page3 { background:linear-gradient(#667eea, #764ba2); color:#fff; padding:20px; }
  #page3 p { font-size:20px; line-height:1.8; }
</style>
</head>
<body>

<!-- PAGE 1 -->
<div id="page1" class="page active">
  <h1>Happy 21st Birthday! 🎉</h1>
  <h2>Zivah 💗</h2>
  <button onclick="go(2)">Next →</button>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
  <h1>Cut The Cake! 🎂</h1>
  <div class="cake" onclick="cut()">🎂</div>
  <p>Click on cake ✂️</p>
  <button id="next2" onclick="go(3)" style="display:none">Next →</button>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
  <h1>To My Bestie Zivah 🦋</h1>
  <p>
    Happy Birthday Bestie! 😌💗<br>
    Tum meri zindagi ka sabse haseen hissa ho.<br>
    Tumhare saath har din special ban jata hai.<br>
    Love you dost! ✨<br><br>
    — Usman 😎
  </p>
</div>

<script>
  function go(n){
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page'+n).classList.add('active');
  }
  function cut(){
    document.querySelector('.cake').innerText = '🍰';
    document.getElementById('next2').style.display = 'block';
  }
</script>

</body>
</html>
